<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A · Scan capture</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D4F54A}a:hover{color:#E6FF8A}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #2E2B27; font-family: 'Inter Tight', system-ui, sans-serif; color: #FFFFFF">
<svg width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="Camera view: a mug on a table inside a dashed bounding box, a lime mesh covering its left half, and three coverage rings on the table" style="position: absolute; left: 0; top: 0">
<defs>
<linearGradient id="a-wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3F3C37"></stop><stop offset="1" stop-color="#6B655C"></stop></linearGradient>
<linearGradient id="a-table" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8A6849"></stop><stop offset="1" stop-color="#3A2A1D"></stop></linearGradient>
<linearGradient id="a-mug" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8F8981"></stop><stop offset="0.4" stop-color="#ECE7DE"></stop><stop offset="1" stop-color="#7E786F"></stop></linearGradient>
<pattern id="a-tri" width="14" height="12" patternUnits="userSpaceOnUse"><path d="M0 12 L7 0 L14 12 M0 0 L14 0" fill="none" stroke="{{accent}}" stroke-width="0.9"></path></pattern>
<clipPath id="a-mugclip"><path d="M150 380 L150 500 Q150 522 172 522 L218 522 Q240 522 240 500 L240 380 Z"></path></clipPath>
<filter id="a-blur"><feGaussianBlur stdDeviation="10"></feGaussianBlur></filter>
</defs>
<rect x="0" y="0" width="390" height="470" fill="url(#a-wall)"></rect>
<rect x="250" y="40" width="160" height="230" rx="6" fill="#EDE8DC" opacity="0.85" filter="url(#a-blur)"></rect>
<rect x="18" y="300" width="70" height="170" rx="30" fill="#3E5A3A" opacity="0.8" filter="url(#a-blur)"></rect>
<rect x="0" y="470" width="390" height="374" fill="url(#a-table)"></rect>
<ellipse cx="195" cy="524" rx="72" ry="14" fill="#000000" opacity="0.35"></ellipse>
<g fill="none" stroke-linecap="butt">
<ellipse cx="195" cy="520" rx="172" ry="50" stroke="#000000" stroke-opacity="0.45" stroke-width="10" pathLength="360" stroke-dasharray="10 2"></ellipse>
<ellipse cx="195" cy="520" rx="172" ry="50" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1.5" pathLength="360" stroke-dasharray="10 2"></ellipse>
<ellipse cx="195" cy="520" rx="150" ry="42" stroke="#000000" stroke-opacity="0.45" stroke-width="10" pathLength="360" stroke-dasharray="10 2"></ellipse>
<ellipse cx="195" cy="520" rx="150" ry="42" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1.5" pathLength="360" stroke-dasharray="10 2"></ellipse>
<ellipse cx="195" cy="520" rx="150" ry="42" stroke="{{accent}}" stroke-width="7" pathLength="360" stroke-dasharray="10 2 10 2 10 2 10 2 10 2 10 2 10 2 10 2 10 2 10 2 10 2 10 2 10 2 10 2 0 360"></ellipse>
<ellipse cx="195" cy="520" rx="128" ry="34" stroke="#000000" stroke-opacity="0.45" stroke-width="11" pathLength="360" stroke-dasharray="10 2"></ellipse>
<ellipse cx="195" cy="520" rx="128" ry="34" stroke="{{accent}}" stroke-width="7" pathLength="360" stroke-dasharray="10 2"></ellipse>
</g>
<path d="M150 380 L150 500 Q150 522 172 522 L218 522 Q240 522 240 500 L240 380 Z" fill="url(#a-mug)"></path>
<path d="M240 404 C 278 404 278 482 240 480" fill="none" stroke="#CFC9BF" stroke-width="10"></path>
<ellipse cx="195" cy="380" rx="45" ry="10" fill="#B9B2A7"></ellipse>
<ellipse cx="195" cy="381" rx="40" ry="7" fill="#5E574F"></ellipse>
<g clip-path="url(#a-mugclip)">
<rect x="140" y="368" width="74" height="160" fill="{{accent}}" fill-opacity="0.16"></rect>
<rect x="140" y="368" width="74" height="160" fill="url(#a-tri)"></rect>
</g>
<path d="M214 372 L214 522" stroke="{{accent}}" stroke-width="2" stroke-dasharray="3 3"></path>
<g fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-dasharray="4 4" opacity="0.9">
<rect x="128" y="360" width="146" height="176"></rect>
<path d="M146 346 L292 346 L292 522 M128 360 L146 346 M274 360 L292 346 M274 536 L292 522"></path>
</g>
<g fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
<path d="M128 374 L128 360 L142 360 M260 360 L274 360 L274 374 M128 522 L128 536 L142 536 M260 536 L274 536 L274 522"></path>
</g>
</svg>

<div style="position: absolute; left: 16px; top: 48px; width: 358px; display: flex; align-items: center; justify-content: space-between">
<button aria-label="Cancel scan" style="width: 48px; height: 48px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.16); background: rgba(14,15,16,0.72); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<div style="height: 36px; padding: 0 14px; border-radius: 18px; background: rgba(14,15,16,0.72); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.16); display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.04em"><span style="width: 8px; height: 8px; border-radius: 4px; background: #FF5A4E"></span>SCANNING 01:12</div>
<button aria-label="Toggle torch" style="width: 48px; height: 48px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.16); background: rgba(14,15,16,0.72); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></button>
</div>

<div role="status" style="position: absolute; left: 50%; top: 124px; transform: translateX(-50%); height: 60px; padding: 0 24px 0 18px; border-radius: 30px; background: {{accent}}; color: #12140A; display: flex; align-items: center; gap: 12px; box-shadow: 0 0 0 4px rgba(0,0,0,0.35); white-space: nowrap">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#12140A" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 17a8 8 0 0 1 16 0"></path><path d="M12 17l-5-5"></path></svg>
<span style="font-size: 22px; line-height: 28px; font-weight: 700">Move slower</span>
</div>

<div style="position: absolute; left: 16px; top: 620px; width: 358px; height: 104px; box-sizing: border-box; padding: 16px 18px; border-radius: 20px; background: rgba(14,15,16,0.78); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.14); display: flex; align-items: center; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 2px; width: 92px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 36px; line-height: 40px; font-weight: 700">49<span style="font-size: 20px">%</span></span>
<span style="font-size: 13px; line-height: 16px; color: #C9CDD2">coverage</span>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 9px; font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 14px; font-weight: 500">
<div style="display: flex; align-items: center; gap: 10px"><span style="width: 36px; color: #C9CDD2">HIGH</span><span style="flex-grow: 1; height: 8px; border-radius: 4px; border: 1.5px dashed rgba(255,255,255,0.6); box-sizing: border-box"></span><span style="width: 34px; text-align: right">0%</span></div>
<div style="display: flex; align-items: center; gap: 10px"><span style="width: 36px; color: #C9CDD2">MID</span><span style="flex-grow: 1; height: 8px; border-radius: 4px; border: 1.5px solid rgba(255,255,255,0.6); box-sizing: border-box; background: linear-gradient(90deg, {{accent}} 47%, transparent 47%)"></span><span style="width: 34px; text-align: right">47%</span></div>
<div style="display: flex; align-items: center; gap: 10px"><span style="width: 36px; color: #C9CDD2">LOW</span><span style="flex-grow: 1; height: 8px; border-radius: 4px; background: {{accent}}"></span><span style="width: 34px; display: flex; justify-content: flex-end"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-label="Done" role="img"><path d="M5 12l5 5L20 7"></path></svg></span></div>
</div>
</div>

<div style="position: absolute; left: 24px; top: 748px; width: 342px; display: flex; align-items: center; justify-content: space-between">
<button aria-label="Pause scan" style="width: 60px; height: 60px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.16); background: rgba(14,15,16,0.78); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M8 5v14M16 5v14"></path></svg></button>
<button style="width: 184px; height: 64px; border-radius: 32px; border: none; background: #FFFFFF; color: #111214; font-family: 'Inter Tight', sans-serif; font-size: 19px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111214" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>Finish</button>
<button aria-label="Hide mesh overlay" style="width: 60px; height: 60px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.16); background: rgba(14,15,16,0.78); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"></path><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"></path></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D4F54A","options":["#D4F54A","#FFD23F","#3EE8B5"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#D4F54A' };
}
}
</script>
</body>
</html>
