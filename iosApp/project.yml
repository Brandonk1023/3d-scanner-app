# XcodeGen spec — the .xcodeproj is generated (`make xcodeproj`) and git-ignored. Never edit it by hand.
name: iosApp
options:
  bundleIdPrefix: app.facet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Facet
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arm64]
        NSCameraUsageDescription: "Facet uses the camera to scan objects. Everything is processed on this phone. Nothing is uploaded."
    settings:
      base:
        # PLACEHOLDER — final bundle id still to be decided (see DEV_TODO.md).
        PRODUCT_BUNDLE_IDENTIFIER: app.facet.ios
        PRODUCT_NAME: Facet
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # Kotlin framework built by Gradle (see preBuildScripts).
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        # Shared is a static framework; the C++ core inside it needs libc++.
        OTHER_LDFLAGS: "$(inherited) -framework Shared -lc++"
        # Gradle reads/writes outside the sandboxed script inputs.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
        # Apple Silicon only: shared has no iosX64 target.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    preBuildScripts:
      - name: Build Kotlin shared framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
